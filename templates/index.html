{% extends "base.html" %}
{% block content %}

{% for categoria, libros in biblioteca.items() %}
<h3 class="mt-4">🏷️ {{ categoria }}</h3>
<div class="row">
    {% for libro in libros %}
    <div class="col-md-3">
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h6 class="card-title text-truncate">{{ libro }}</h6>
                <a href="/descargar/{{ categoria }}/{{ libro }}" class="btn btn-primary btn-sm">⬇️ Descargar</a>
                <a href="/eliminar/{{ categoria }}/{{ libro }}" class="btn btn-danger btn-sm">🗑️</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endfor %}

{% endblock %}
